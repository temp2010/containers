services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${ADMIN_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${ADMIN_PASSWORD}
      - TZ=${TZ}
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - ./data:/data/db
      - ./config:/etc/mongo/conf.d:ro
    ports:
      - "27017:27017"
