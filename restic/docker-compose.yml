version: '3.8'

services:
  restic:
    image: restic/restic:latest
    container_name: restic
    hostname: restic
    restart: unless-stopped
    volumes:
      - ./restic-backup.sh:/restic-backup.sh:ro
      - ./restic-restore.sh:/restic-restore.sh:ro
      - /var/lib/docker/volumes:/volumes:ro
      - ${RESTIC_BACKUP_PATH:-/mnt/backup}:/mnt/backup
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    environment:
      # Restic repository configuration
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-/mnt/backup/restic-repo}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-changeme}

      # Backup configuration
      - BACKUP_PATHS=${BACKUP_PATHS:-/volumes}
      - BACKUP_EXCLUDE=${BACKUP_EXCLUDE:-}
      - RETENTION_DAILY=${RETENTION_DAILY:-7}
      - RETENTION_WEEKLY=${RETENTION_WEEKLY:-4}
      - RETENTION_MONTHLY=${RETENTION_MONTHLY:-12}

      # Database backups
      - BACKUP_POSTGRES=${BACKUP_POSTGRES:-false}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}

      - BACKUP_MONGODB=${BACKUP_MONGODB:-false}
      - MONGODB_HOST=${MONGODB_HOST:-mongodb}
      - MONGODB_USER=${MONGODB_USER:-root}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-}

      # AWS S3 (opcional)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}

      # Cron schedule for automated backups (formato cron)
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - TZ=${TZ:-UTC}

    # Solo ejecutar el contenedor en modo daemon (no correr backup permanentemente)
    command: /bin/sleep infinity

    networks:
      - default
    profiles:
      - backup

  # Servicio auxiliar para ejecutar backups programados
  restic-cron:
    image: mcuadros/ofelia:latest
    container_name: restic-cron
    hostname: restic-cron
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - default
    labels:
      # Ejecutar backup automático
      ofelia: "enabled"
      ofelia.enabled: "true"
      ofelia.save-folder: "/etc/ofelia"
    profiles:
      - backup

volumes:
  backup-data:
    driver: local
