services:
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    hostname: rclone
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      # Tokens OAuth: excluidos de git en .gitignore
      - ./config:/config/rclone
      - ./entrypoint.sh:/entrypoint.sh:ro
      # /mnt completo con propagación: un montaje sobre la raíz de un bind (p. ej. /mnt/onedrive) no llega al host
      - /mnt:/mnt:rshared
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
