services:
  mysql:
    image: mysql:9.3
    container_name: mysql
    hostname: mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${ADMIN_PASSWORD}
      - TZ=${TZ}
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - ./data:/var/lib/mysql
      - ./config:/etc/mysql/conf.d:ro
    ports:
      - "3306:3306"
