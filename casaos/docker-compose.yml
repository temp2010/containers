services:
  casaos:
    image: casaos/casaos:latest
    container_name: casaos
    hostname: casaos
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
      - ./data:/data
    environment:
      - TZ=${TZ}
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
