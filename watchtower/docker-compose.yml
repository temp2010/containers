services:
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      # Solo avisa: no actualiza nada por sí solo
      - WATCHTOWER_MONITOR_ONLY=true
      # Los martes a las 09:00 (formato cron con segundos)
      - WATCHTOWER_SCHEDULE=0 0 9 * * TUE
      - WATCHTOWER_CLEANUP=false
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
