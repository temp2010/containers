# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sitio por defecto: home.arpa -> /var/www/html
server {
    listen 80 default_server;
    server_name home.arpa www.home.arpa raspberry.local www.raspberry.local _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# homepage.home.arpa -> 3000 (reemplaza a heimdall.home.arpa)
server {
    listen 80;
    server_name homepage.home.arpa;

    location / {
        proxy_pass http://192.168.83.22:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

