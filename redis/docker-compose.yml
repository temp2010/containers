services:
  redis:
    image: redis:7.2
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    environment:
      - TZ=${TZ}
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - ./data:/data
      - ./config:/usr/local/etc/redis:ro
    ports:
      - "6379:6379"
