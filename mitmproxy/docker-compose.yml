services:
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: mitmproxy
    hostname: mitmproxy
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./mitmproxy:/home/mitmproxy/.mitmproxy
    environment:
      - TZ=${TZ}
    command: mitmweb --mode transparent --web-host 0.0.0.0 --web-port 8080 --listen-port 8081
    stdin_open: true
    tty: true
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
